; ─────────────────────────────────────────────────────────────────────────────
; Dedicated worker for the `translation` queue (TranslateBookJob — whole-book
; Chinese ↔ English translation into a new copy, docs/translation.md).
;
; WHY ITS OWN WORKER: a book translation is hundreds of batched LLM calls and
; holds the worker for up to an hour (job $timeout 3600s, WORK_BUDGET 3000s
; then hand-off to a fresh job). On `default` it would head-of-line-block
; every user's import behind one novel — the exact lesson already learned
; three times (vibe, citation, audio). Same pattern as hyperlit-audio.
;
; Install on the droplet (app dir /var/www/hyperlit, SSH marx@170.64.145.89):
;   sudo cp deploy/supervisor/hyperlit-translation.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start hyperlit-translation:*
;
; TIMEOUT ORDERING (must hold so nothing kills a job mid-run):
;   job $timeout 3600s  =  worker --timeout 3600s  <  stopwaitsecs 3610s
;   and retry_after (config/queue.php, 7500s) > 3600s so a long book is never
;   re-reserved and double-billed by a parallel worker.
;
; INTERRUPTION IS CHEAP: the job is resumable — every finished paragraph lands
; in storage/app/book-translations/*/cache.json, the job charges only the
; tokens each run actually used, and a re-press (or the job's own pre-timeout
; hand-off) skips everything already translated. A SIGKILL mid-book loses
; nothing but the in-flight batches; stopwaitsecs still waits politely.
;
; RAM: moderate — a PHP worker doing batched LLM HTTP calls (6 section workers
; in flight, JSON request/response bodies); audio-class footprint
; (~150–300 MB est — re-measure with tests/load/memprobe.sh once live).
; numprocs=1 — one book translates at a time; the per-(book,target,user)
; Cache::lock also serializes duplicate requests upstream. --max-jobs recycles
; the PHP process so leaked memory can't accumulate across books.
; ─────────────────────────────────────────────────────────────────────────────
[program:hyperlit-translation]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hyperlit/artisan queue:work --queue=translation --sleep=3 --tries=1 --timeout=3600 --max-jobs=20
directory=/var/www/hyperlit
user=marx
numprocs=1
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=3610
stopsignal=SIGTERM
redirect_stderr=true
stdout_logfile=/var/www/hyperlit/storage/logs/translation-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
