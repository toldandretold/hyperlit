; ─────────────────────────────────────────────────────────────────────────────
; Dedicated worker for the `audio-package` queue (BuildAudiobookJob — packages
; a book's per-node MP3s into one downloadable .m4b, docs/audio.md).
;
; WHY ITS OWN WORKER: packaging is a ~1–2 minute ffmpeg encode, but it used to
; share the `audio` queue with GenerateBookAudioJob — whose narration runs hold
; the worker for up to an HOUR. Observed on prod 2026-08-13: a user's download
; button sat at "Packaging 0%" for 18 minutes because their build was queued
; behind someone else's narration. Same head-of-line lesson as vibe/citation/
; search — a user actively waiting on a fast job must never queue behind a
; slow one.
;
; Install on the droplet (app dir /var/www/hyperlit, SSH marx@170.64.145.89):
;   sudo cp deploy/supervisor/hyperlit-audio-package.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start hyperlit-audio-package:*
;
; TIMEOUT ORDERING (must hold so nothing kills a job mid-run):
;   job $timeout 3600s  =  worker --timeout 3600s  <  stopwaitsecs 3610s
;   and retry_after (config/queue.php, 7500s) > 3600s. 3600s is generous — a
;   40-minute book encodes in ~95s on the 1-vCPU droplet (~25–30x realtime) —
;   but a very long audiobook (tens of hours) legitimately needs it.
;
; INTERRUPTION IS CHEAP: the artifact is written tmp+rename and cached under a
; digest of the input filenames, so a SIGKILL mid-encode loses only that
; encode; the user presses download again. failed() releases the build lock.
;
; RAM/CPU: the PHP worker is light (~60 MB); the real cost is the ffmpeg child
; (~100–150 MB RSS, one core flat out for the encode). numprocs=1 — encodes are
; CPU-bound, so on a small droplet parallel encodes just halve each other;
; raise numprocs only after the box has spare cores (see the RAM budget in
; README.md). --max-jobs recycles the PHP process so leaked memory can't
; accumulate.
; ─────────────────────────────────────────────────────────────────────────────
[program:hyperlit-audio-package]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hyperlit/artisan queue:work --queue=audio-package --sleep=3 --tries=1 --timeout=3600 --max-jobs=20
directory=/var/www/hyperlit
user=marx
numprocs=1
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=3610
stopsignal=SIGTERM
redirect_stderr=true
stdout_logfile=/var/www/hyperlit/storage/logs/audio-package-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
