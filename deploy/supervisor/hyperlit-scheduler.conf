; ─────────────────────────────────────────────────────────────────────────────
; Laravel's scheduler (routes/console.php: 16+ tasks — daily stats, homepage, licence
; discovery 05:10, licence review 05:40, cleanup, …) as a supervised process instead of a
; crontab line. `schedule:work` runs `schedule:run` every minute as a FRESH subprocess, so it
; picks up new code on every tick with no restart after a deploy.
;
; WHY HERE AND NOT CRON: no crontab running schedule:run was ever found for `marx` on the
; droplet, so scheduled tasks may never have run. Supervisor is where every other long-lived
; process already lives, deploy.sh installs changed confs, and workers.sh reports on it.
;
; ⚠️ BEFORE INSTALLING, make sure no cron ALSO runs the scheduler, or every task runs twice:
;   crontab -l ; sudo crontab -l ; sudo crontab -u www-data -l     (look for schedule:run)
; Remove any such line first.
;
; Install (deploy.sh offers this when a conf changes):
;   sudo cp deploy/supervisor/hyperlit-scheduler.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Heavy scheduled work is dispatched as JOBS onto the queue workers; the scheduler itself only
; enqueues and runs short commands, so it needs ~40 MB and one process.
; ─────────────────────────────────────────────────────────────────────────────
[program:hyperlit-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hyperlit/artisan schedule:work
directory=/var/www/hyperlit
user=marx
environment=HOME="/home/marx"
numprocs=1
autostart=true
autorestart=true
startsecs=1
; A scheduled command running inline (e.g. library:licence-review) gets time to finish.
stopwaitsecs=600
stopsignal=SIGTERM
redirect_stderr=true
stdout_logfile=/var/www/hyperlit/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
