; ─────────────────────────────────────────────────────────────────────────────
; Dedicated worker for the `archive-export` queue (BuildArchiveExportJob — the
; whole-library downloads behind the archive panel and the Data sovereignty
; overlay: a markdown vault zip or a SQLite data file).
;
; WHY THIS FILE EXISTS: the job shipped 2026-09-08 with its queue wired into
; package.json and queue:probe but NO Supervisor program, so on prod nothing
; ever consumed `archive-export` — every "Download" press dispatched a job
; that never ran, the button sat at "0%" and no file ever arrived (reported
; 2026-11-13). A queue nobody listens on silently never runs.
; tests/Feature/Architecture/QueueWorkersHaveSupervisorConfTest.php now fails
; when a queue has no conf here.
;
; WHY ITS OWN WORKER: a big corpus is minutes of HTML→markdown CPU, and a user
; is watching a progress readout — it must not queue behind imports, and a
; long export must not block them either.
;
; Install on the droplet (app dir /var/www/hyperlit, SSH marx@170.64.145.89):
;   sudo cp deploy/supervisor/hyperlit-archive-export.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status 'hyperlit-archive-export:*'
;
; TIMEOUT ORDERING (must hold so nothing kills a job mid-run):
;   job $timeout 3600s  =  worker --timeout 3600s  <  stopwaitsecs 3610s
;   and retry_after (config/queue.php, 7500s) > 3600s.
;
; INTERRUPTION IS CHEAP: the artifact is written to a .work path and renamed,
; cached under a digest of the corpus; a killed build loses only that build,
; failed() releases the lock and the user presses download again.
;
; RAM/CPU: pure PHP (DOMDocument + html-to-markdown, ZipArchive / pdo_sqlite),
; one core for the length of the build; numprocs=1 — builds are CPU-bound.
; --max-jobs recycles the process so a huge corpus can't leave memory behind.
; ─────────────────────────────────────────────────────────────────────────────
[program:hyperlit-archive-export]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hyperlit/artisan queue:work --queue=archive-export --sleep=3 --tries=1 --timeout=3600 --max-jobs=10
directory=/var/www/hyperlit
user=marx
numprocs=1
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=3610
stopsignal=SIGTERM
redirect_stderr=true
stdout_logfile=/var/www/hyperlit/storage/logs/archive-export-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
