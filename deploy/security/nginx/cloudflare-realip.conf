# ─────────────────────────────────────────────────────────────────────────────
# cloudflare-realip.conf — make nginx log and pass the VISITOR's IP, not Cloudflare's.
#
# hyperlit.io sits behind Cloudflare, so every TCP connection nginx sees comes
# from a Cloudflare edge. Without this, access.log, $remote_addr, REMOTE_ADDR in
# PHP, CrowdSec's parsers and the firewall bouncer all see Cloudflare's address:
# CrowdSec would ban Cloudflare itself (= the whole site goes dark for everyone)
# and Laravel's per-IP rate limiters would share one bucket per edge node.
#
# Trust ONLY Cloudflare's published ranges. A client that is not Cloudflare and
# sends its own CF-Connecting-IP header is ignored — its socket IP stands.
#
# Install:   sudo cp deploy/security/nginx/cloudflare-realip.conf /etc/nginx/snippets/
#            then `include snippets/cloudflare-realip.conf;` inside the http {} block
#            (/etc/nginx/nginx.conf) — NOT per-server, so every vhost agrees.
#            sudo nginx -t && sudo systemctl reload nginx
# Refresh:   deploy/security/cloudflare-ips.sh --nginx regenerates this file from
#            https://www.cloudflare.com/ips-v4 and /ips-v6 (cron it monthly).
#
# This committed copy is a SEED: the same ranges Laravel trusts in
# bootstrap/app.php (trustProxies). tests/Feature/Architecture/CloudflareRangesParityTest.php
# fails if the two lists drift — update both from https://www.cloudflare.com/ips/.
# ─────────────────────────────────────────────────────────────────────────────

# Cloudflare IPv4 — https://www.cloudflare.com/ips-v4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 — https://www.cloudflare.com/ips-v6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Cloudflare puts the visitor's address in this header on every proxied request.
# (X-Forwarded-For would also work but can carry a client-supplied chain; this
# header is set by Cloudflare alone.)
real_ip_header CF-Connecting-IP;
