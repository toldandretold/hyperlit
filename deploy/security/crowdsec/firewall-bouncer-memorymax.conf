# systemd drop-in for crowdsec-firewall-bouncer (same reasoning as crowdsec-memorymax.conf).
# Install: sudo mkdir -p /etc/systemd/system/crowdsec-firewall-bouncer.service.d
#          sudo cp deploy/security/crowdsec/firewall-bouncer-memorymax.conf \
#              /etc/systemd/system/crowdsec-firewall-bouncer.service.d/memorymax.conf
#          sudo systemctl daemon-reload && sudo systemctl restart crowdsec-firewall-bouncer
[Service]
MemoryMax=100M
