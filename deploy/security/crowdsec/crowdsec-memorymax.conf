# ─────────────────────────────────────────────────────────────────────────────
# systemd drop-in for the CrowdSec agent — a hard memory ceiling.
#
# Install:  sudo mkdir -p /etc/systemd/system/crowdsec.service.d
#           sudo cp deploy/security/crowdsec/crowdsec-memorymax.conf \
#               /etc/systemd/system/crowdsec.service.d/memorymax.conf
#           sudo systemctl daemon-reload && sudo systemctl restart crowdsec
#
# WHY: the agent idles at ~70–100 MB, but its enrichment caches (reverse DNS,
# GeoIP) have been reported growing to gigabytes on busy hosts. The droplet is
# 4 GB shared with PHP-FPM, ten queue workers and Python OCR runs
# (deploy/supervisor/README.md "RAM budget"). A security daemon must never be
# the thing that gets a conversion worker OOM-killed. With this cap the kernel
# kills CROWDSEC at 300 MB (systemd restarts it) instead of a worker.
#
# If `journalctl -u crowdsec` ever shows it being killed at the cap, do not just
# raise it — find the cache that grew (`cscli metrics`), it is a config problem.
# ─────────────────────────────────────────────────────────────────────────────
[Service]
MemoryMax=300M
MemoryHigh=250M
# Logs and the local API are not latency-critical; let the real work win CPU.
Nice=5
IOSchedulingClass=best-effort
IOSchedulingPriority=6
