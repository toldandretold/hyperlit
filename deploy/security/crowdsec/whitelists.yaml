# ─────────────────────────────────────────────────────────────────────────────
# CrowdSec whitelist — addresses that must NEVER be banned, whatever the logs say.
#
# Install:  sudo cp deploy/security/crowdsec/whitelists.yaml \
#               /etc/crowdsec/parsers/s02-enrich/hyperlit-whitelists.yaml
#           sudo systemctl reload crowdsec
#
# Two groups:
#
# 1. Cloudflare's ranges. With the nginx real-IP snippet in place these never
#    appear as a client IP, so this is a BACKSTOP for the day someone edits
#    nginx.conf and drops the include: without it, the next scanner that comes
#    through Cloudflare gets Cloudflare banned at the firewall, and the site is
#    dark for everyone until `cscli decisions delete`. Keep in step with
#    bootstrap/app.php / deploy/security/nginx/cloudflare-realip.conf.
#
# 2. The operator. Put your own home/office IP(s) under `ip:` below (or a CIDR
#    under `cidr:`) so a mistyped password or an e2e run from your machine does
#    not lock you out. Replace the placeholder — a wrong entry here is only a
#    missing safety net, never a hole: whitelisting only suppresses BANS.
#
# Whitelisting happens at parse time, so whitelisted traffic also never reaches
# the community blocklist signal. That is what you want for your own IP.
# ─────────────────────────────────────────────────────────────────────────────
name: hyperlit/whitelists
description: "Never ban Cloudflare's edge or the operator"
whitelist:
  reason: "Cloudflare edge ranges + operator"
  ip:
    # - 203.0.113.7        # ← operator: replace with your real IP (ipv4 and/or ipv6)
  cidr:
    # Cloudflare IPv4 — https://www.cloudflare.com/ips-v4
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    # Cloudflare IPv6 — https://www.cloudflare.com/ips-v6
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32
