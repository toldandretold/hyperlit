name: security-audit

# Flags known-vulnerable dependencies in composer.json and package.json.
# Runs on every push to main and every PR so a new advisory affecting our
# dependency tree surfaces immediately rather than being noticed months later.
#
# ENFORCING since 2026-11-18: the pre-existing advisories were cleared that day
# (Laravel 11 → 12, katex 0.19, dompurify 3.4.18, symfony/yaml 7.4), so a red
# run now means a NEW advisory. composer is audited with dev deps (they run on
# every developer machine); npm is audited for RUNTIME deps only — the dev
# tree (vitest, happy-dom, glob…) never ships to a browser and carries
# advisories that only a vitest major clears. deploy/deploy.sh applies the
# same two checks before every prod deploy (deploy/security/README.md §7).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run weekly so newly-published advisories against unchanged dependencies surface.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  composer-audit:
    name: composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      # --no-scripts: package post-install scripts can't break the audit step
      # on a CI host that doesn't have the full app environment.
      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-scripts --no-interaction

      - name: Run composer audit
        run: composer audit --locked

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # --omit=dev: runtime (browser-bundle) deps only, see the header.
      # --audit-level=high: lower-severity findings still print but do not fail.
      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=high
